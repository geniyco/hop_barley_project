version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hop_barley_db_container
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=hop_barley_db
      - POSTGRES_USER=shop_user
      - POSTGRES_PASSWORD=shop_secure_pass
    ports:
      - "5432:5432"

  web:
    build: ./backend
    container_name: hop_barley_web_container
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://shop_user:shop_secure_pass@db:5432/hop_barley_db
      - SECRET_KEY=django-insecure-dev-key-12345
      - DEBUG=True
    depends_on:
      - db

volumes:
  postgres_data: